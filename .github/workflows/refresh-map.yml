name: Refresh Crime Radr Map

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install folium requests beautifulsoup4 lxml

      - name: Run live ingestion and rebuild map
        run: |
          python -m src.run_pipeline
          mkdir -p docs
          cp output/index.html docs/index.html

      - name: Commit and push updated DB and map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/crime_radr.db data/sa_provinces.geojson output/index.html docs/index.html docs/og-card.png
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update: Refresh Crime Radr incidents and map [skip ci]"
            git push
          fi
